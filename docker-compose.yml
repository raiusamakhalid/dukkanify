services:
  postgres:
    image: postgres:16-alpine
    container_name: dukkanify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukkanify
      POSTGRES_PASSWORD: dukkanify
      POSTGRES_DB: dukkanify
    # Host 5432 is already taken by the system PostgreSQL on this machine.
    # Use 5433 so the container can publish, and register that port in pgAdmin.
    ports: ["5433:5432"]
    volumes: ["dukkanify-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkanify"]
      interval: 5s
      retries: 10
volumes:
  dukkanify-pgdata:
