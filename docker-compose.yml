services:
  postgres:
    image: postgres:16-alpine
    container_name: dukkanify-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dukkanify
      POSTGRES_PASSWORD: dukkanify
      POSTGRES_DB: dukkanify
    # 5433 on the host: a PostgreSQL install already owns 5432 on this machine, and a
    # silent collision means migrations land in the wrong database.
    ports: ["5433:5432"]
    volumes: ["dukkanify-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukkanify"]
      interval: 5s
      retries: 10
volumes:
  dukkanify-pgdata:
